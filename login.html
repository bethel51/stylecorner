<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Style Corner</title>
    <meta name="description" content="Sign in to your Style Corner account to manage bookings, orders, and your personal profile.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #faf9f6;
            display: flex;
            overflow: hidden;
        }

        /* ── Image Panel ── */
        .auth-image-panel {
            flex: 0 0 52%;
            position: relative;
            overflow: hidden;
        }

        .auth-image-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            display: block;
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(23,23,23,0.72) 0%, rgba(23,23,23,0.35) 50%, rgba(212,175,55,0.18) 100%);
        }

        .image-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4rem 4.5rem;
        }

        .image-eyebrow {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .image-eyebrow::before {
            content: '';
            display: block;
            width: 32px;
            height: 2px;
            background: #d4af37;
        }

        .image-heading {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.5rem, 4vw, 4rem);
            font-weight: 800;
            color: #ffffff;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 1.25rem;
        }

        .image-sub {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.72);
            font-weight: 400;
            line-height: 1.6;
            max-width: 380px;
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: #d4af37; top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #4A2C6A; bottom: 100px; left: -80px; }

        /* ── Form Panel ── */
        .auth-form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            overflow-y: auto;
            background: #faf9f6;
        }

        .form-card {
            width: 100%;
            max-width: 440px;
        }

        /* Logo */
        .form-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #171717;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 3.5rem;
        }
        .form-logo span { color: #d4af37; }

        /* Form heading */
        .form-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2rem, 4vw, 2.75rem);
            font-weight: 800;
            color: #171717;
            letter-spacing: -0.04em;
            line-height: 1.05;
            margin-bottom: 0.75rem;
        }

        .form-subtitle {
            font-size: 0.975rem;
            color: #6b7280;
            margin-bottom: 2.75rem;
            line-height: 1.6;
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #171717;
            margin-bottom: 0.6rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 0.95rem;
            transition: color 0.2s;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.2rem 1rem 3rem;
            background: #ffffff;
            border: 1.5px solid #e5e7eb;
            border-radius: 14px;
            font-size: 0.975rem;
            font-family: 'Inter', sans-serif;
            color: #171717;
            font-weight: 500;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-input::placeholder { color: #9ca3af; font-weight: 400; }

        .form-input:focus {
            border-color: #d4af37;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.12);
        }

        .input-wrap:focus-within i { color: #d4af37; }

        /* Submit Button */
        .btn-signin {
            width: 100%;
            padding: 1.1rem 2rem;
            background: #171717;
            color: #d4af37;
            border: none;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-signin::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.15), transparent);
            transition: left 0.5s ease;
        }

        .btn-signin:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,0.18); }
        .btn-signin:hover::before { left: 100%; }
        .btn-signin:disabled { opacity: 0.65; transform: none; cursor: not-allowed; }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .divider span {
            font-size: 0.8rem;
            color: #9ca3af;
            font-weight: 500;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Footer link */
        .form-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
        }
        .form-footer a {
            color: #d4af37;
            font-weight: 700;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
        }
        .form-footer a:hover { opacity: 0.8; }

        /* Subtitle success state */
        #subtitle-msg { transition: all 0.3s; }

        /* Responsive */
        @media (max-width: 860px) {
            body { flex-direction: column; overflow: auto; }
            .auth-image-panel { flex: 0 0 42vh; }
            .image-content { padding: 2.5rem; }
            .image-heading { font-size: 2.2rem; }
            .auth-form-panel { padding: 3rem 1.5rem; }
            .form-card { max-width: 100%; }
        }
    </style>
</head>

<body>
    <!-- Image Panel -->
    <div class="auth-image-panel">
        <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1200&q=80&fm=webp" alt="Style Corner Salon">
        <div class="image-overlay"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="image-content">
            <p class="image-eyebrow">Style Corner</p>
            <h2 class="image-heading">Welcome<br>Back.</h2>
            <p class="image-sub">Step into your personal style space. Where every session is crafted just for you.</p>
        </div>
    </div>

    <!-- Form Panel -->
    <div class="auth-form-panel">
        <div class="form-card">
            <a href="index.html" class="form-logo">STYLE<span>CORNER</span></a>

            <h1 class="form-title">Sign In</h1>
            <p class="form-subtitle" id="subtitle-msg">Enter your details to access your account.</p>

            <form id="login-form">
                <div class="input-group">
                    <label class="input-label" for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="phone">Phone Number</label>
                    <div class="input-wrap">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" class="form-input" placeholder="+234 000 0000 000" required>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 2rem;">
                    <label class="input-label" for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-signin" id="signin-btn">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    Log In
                </button>
            </form>

            <div class="divider"><span>New here?</span></div>

            <div class="form-footer">
                <p>Don't have an account? <a href="role-selection.html">Join Style Corner &rarr;</a></p>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect');

            if (urlParams.get('signup') === 'success') {
                const subtitle = document.getElementById('subtitle-msg');
                subtitle.textContent = "Account created! Please sign in to continue.";
                subtitle.style.color = "#10b981";
                subtitle.style.fontWeight = "600";
            }

            const form = document.getElementById('login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('signin-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging In...';

                const data = {
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value
                };

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: data.email, password: data.password })
                    });
                    const result = await res.json();

                    if (!res.ok) {
                        if (result.error === 'unverified') {
                            const redirectParam = redirectUrl ? `&redirect=${encodeURIComponent(redirectUrl)}` : '';
                            window.location.href = `verify.html?email=${encodeURIComponent(data.email)}${redirectParam}`;
                            return;
                        }
                        window.showToast(result.error || 'Login failed', 'error');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Log In';
                        return;
                    }

                    localStorage.setItem('mockUser', JSON.stringify(result.user));
                    localStorage.setItem('token', result.token);

                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    } else if (result.user.role === 'staff') {
                        window.location.href = 'expert-dashboard.html';
                    } else {
                        window.location.href = 'customer-dashboard.html';
                    }
                } catch (error) {
                    console.error(error);
                    window.showToast('Server error during login', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Log In';
                }
            });
        });
    </script>
</body>

</html>
