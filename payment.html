<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Checkout | Style Corner</title>
    <meta name="description" content="Complete your purchase with Style Corner luxury boutique.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #faf9f6;
            color: #171717;
            min-height: 100vh;
        }
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            height: 5rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 2rem;
        }
        .payment-wrapper {
            max-width: 1100px;
            margin: 7.5rem auto 4rem;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 2.5rem;
        }
        .payment-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 2.5rem;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 15px 35px rgba(0,0,0,0.03);
        }
        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #171717;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #171717;
            margin-bottom: 0.5rem;
        }
        .form-input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.25s;
        }
        .form-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.1);
        }
        .payment-method-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .method-card {
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            padding: 1.25rem 1rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
        }
        .method-card.active {
            border-color: #d4af37;
            background: rgba(212,175,55,0.06);
        }
        .method-card i {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #d4af37;
            display: block;
        }
        .method-card span {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: #171717;
            display: block;
        }
        .order-summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .order-summary-item:last-child {
            border-bottom: none;
        }
        .item-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .item-price {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #171717;
        }
        .btn-pay {
            width: 100%;
            padding: 1.1rem;
            background: #171717;
            color: #d4af37;
            border: none;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.22);
            color: #ffffff;
        }

        @media (max-width: 860px) {
            .payment-wrapper {
                grid-template-columns: 1fr;
                margin-top: 6rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" style="width:28px; height:28px; fill:#d4af37;">
                    <path d="M30 20 H70 L80 50 L70 80 H30 L20 50 Z" fill="none" stroke="currentColor" stroke-width="4" />
                    <circle cx="50" cy="50" r="5" fill="currentColor" />
                </svg>
                STYLE<span>CORNER</span>
            </a>
            <nav class="nav" style="display: flex; gap: 1.5rem; align-items: center;">
                <a href="store.html" style="font-family:'Outfit'; font-weight:700; color:#171717; text-decoration:none;">← Return to Store</a>
            </nav>
        </div>
    </header>

    <main class="payment-wrapper">
        <!-- Billing & Shipping Details -->
        <div class="payment-card">
            <h2 class="section-title"><i class="fas fa-truck" style="color:#d4af37;"></i> Delivery & Contact Information</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="cust-name" class="form-input" placeholder="e.g. Ifeanyi Bethel" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="cust-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" id="cust-address" class="form-input" placeholder="123 Luxury Way, Lagos, Nigeria" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="cust-phone" class="form-input" placeholder="+234 800 000 0000" required>
                </div>

                <h2 class="section-title" style="margin-top: 2rem;"><i class="fas fa-credit-card" style="color:#d4af37;"></i> Select Payment Gateway</h2>
                <div class="payment-method-selector">
                    <div class="method-card active" data-method="paystack">
                        <i class="fas fa-shield-halved"></i>
                        <span>Paystack Online</span>
                    </div>
                    <div class="method-card" data-method="direct">
                        <i class="fas fa-bolt"></i>
                        <span>Express Direct</span>
                    </div>
                </div>

                <button type="submit" id="pay-submit-btn" class="btn-pay">
                    <i class="fas fa-lock"></i> Complete Order & Pay
                </button>
            </form>
        </div>

        <!-- Order Summary Side Card -->
        <div class="payment-card" style="height: fit-content;">
            <h2 class="section-title"><i class="fas fa-bag-shopping" style="color:#d4af37;"></i> Order Summary</h2>
            <div id="checkout-items-list" style="margin-bottom: 1.5rem;">
                <!-- Injected via JS -->
            </div>

            <div style="border-top: 2px solid #f3f4f6; padding-top: 1.25rem;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 0.75rem; font-size: 0.9rem; color: #6b7280;">
                    <span>Subtotal</span>
                    <span id="summary-subtotal" style="font-family:'Outfit'; font-weight:700; color:#171717;">₦0</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom: 1.25rem; font-size: 0.9rem; color: #6b7280;">
                    <span>Shipping</span>
                    <span style="font-family:'Outfit'; font-weight:700; color:#10b981;">COMPLIMENTARY</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid #f3f4f6; padding-top: 1rem;">
                    <span style="font-family:'Outfit'; font-size: 1.1rem; font-weight: 800; text-transform: uppercase;">Total Due</span>
                    <span id="summary-total" style="font-family:'Outfit'; font-size: 1.6rem; font-weight: 900; color: #171717;">₦0</span>
                </div>
            </div>
        </div>
    </main>

    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('mockUser') || '{}');
            const cart = JSON.parse(localStorage.getItem('style_corner_cart') || '[]');

            if (user.firstname) {
                document.getElementById('cust-name').value = `${user.firstname || ''} ${user.lastname || ''}`.trim();
                document.getElementById('cust-email').value = user.email || '';
                document.getElementById('cust-phone').value = user.phone || '';
            }

            const itemsContainer = document.getElementById('checkout-items-list');
            const subtotalEl = document.getElementById('summary-subtotal');
            const totalEl = document.getElementById('summary-total');

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p style="color:#9ca3af; text-align:center; padding: 2rem 0;">Your bag is empty.</p>';
            } else {
                let total = 0;
                itemsContainer.innerHTML = cart.map(item => {
                    total += item.price;
                    return `
                        <div class="order-summary-item">
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div style="font-size: 0.75rem; color: #9ca3af;">Qty: 1</div>
                            </div>
                            <div class="item-price">₦${item.price.toLocaleString()}</div>
                        </div>
                    `;
                }).join('');
                subtotalEl.textContent = '₦' + total.toLocaleString();
                totalEl.textContent = '₦' + total.toLocaleString();
            }

            // Payment method selector logic
            let activeMethod = 'paystack';
            document.querySelectorAll('.method-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.method-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    activeMethod = card.dataset.method;
                });
            });

            // Handle payment submission
            document.getElementById('payment-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (cart.length === 0) return window.showToast('Your cart is empty.', 'error');

                const btn = document.getElementById('pay-submit-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing Payment...';

                const name = document.getElementById('cust-name').value;
                const email = document.getElementById('cust-email').value;
                const address = document.getElementById('cust-address').value;
                const phone = document.getElementById('cust-phone').value;
                const ref = 'SC-PAY-' + Math.floor((Math.random() * 1000000000) + 1);

                const completeOrder = async (payRef) => {
                    const token = localStorage.getItem('token');
                    const promises = cart.map(item => {
                        return fetch('/api/orders', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                email: email,
                                item: item.name,
                                price: item.price,
                                address: address,
                                phone: phone,
                                status: 'paid',
                                paymentRef: payRef
                            })
                        }).then(res => res.ok ? res.json() : Promise.reject('Failed'));
                    });

                    try {
                        await Promise.all(promises);
                    } catch (err) {
                        console.log('Order save status:', err);
                    }

                    localStorage.removeItem('style_corner_cart');
                    if (window.showToast) window.showToast('Payment successful! Order registered.', 'success');
                    setTimeout(() => {
                        window.location.href = 'customer-dashboard.html';
                    }, 1200);
                };

                const paystackKey = 'pk_test_YOUR_PAYSTACK_PUBLIC_KEY';
                if (activeMethod === 'paystack' && typeof PaystackPop !== 'undefined' && !paystackKey.includes('YOUR_PAYSTACK_PUBLIC_KEY')) {
                    let totalAmount = 0;
                    cart.forEach(item => totalAmount += item.price);
                    try {
                        let handler = PaystackPop.setup({
                            key: paystackKey,
                            email: email,
                            amount: totalAmount * 100,
                            currency: 'NGN',
                            ref: ref,
                            onClose: function() {
                                window.showToast('Payment window closed.', 'error');
                                btn.disabled = false;
                                btn.innerHTML = '<i class="fas fa-lock"></i> Complete Order & Pay';
                            },
                            callback: function(res) {
                                completeOrder(res.reference || ref);
                            }
                        });
                        handler.openIframe();
                        return;
                    } catch (e) {
                        console.log('Paystack fallback');
                    }
                }

                // Direct or Fallback Payment
                await completeOrder(ref);
            });
        });
    </script>
</body>

</html>
