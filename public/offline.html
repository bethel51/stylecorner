<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>You're Offline — Style Corner</title>
  <meta name="description" content="No internet connection. Open Style Corner once you're back online." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/pwa-icon-192.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #F5B942;
      --gold-glow: rgba(245, 185, 66, 0.35);
      --bg: #08090C;
      --surface: #141722;
      --border: rgba(255, 255, 255, 0.08);
      --text: #FFFFFF;
      --muted: #94a3b8;
      --dim: #64748b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: clamp(1.5rem, 6vw, 3rem) 1.25rem;
      overflow: hidden;
      position: relative;
    }

    .glow-top {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(260px, 60vw, 600px);
      height: clamp(260px, 60vw, 600px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 185, 66, 0.14) 0%, transparent 65%);
      filter: blur(70px);
      pointer-events: none;
    }

    .glow-bottom {
      position: fixed;
      bottom: -15%;
      right: -10%;
      width: clamp(200px, 40vw, 480px);
      height: clamp(200px, 40vw, 480px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.10) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .icon-wrap {
      position: relative;
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.75rem;
    }

    .icon-ring {
      position: absolute;
      inset: -10px;
      border-radius: 32px;
      border: 2px solid rgba(245, 185, 66, 0.28);
      animation: ringFloat 5s ease-in-out infinite;
    }

    .icon-ring-outer {
      position: absolute;
      inset: -20px;
      border-radius: 38px;
      border: 1px solid rgba(245, 185, 66, 0.12);
      animation: ringFloat 7s ease-in-out infinite reverse;
    }

    .icon-img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      object-fit: cover;
      border: 1.5px solid rgba(245, 185, 66, 0.55);
      box-shadow: 0 14px 38px rgba(245, 185, 66, 0.38);
      animation: iconPulse 3s ease-in-out infinite;
    }

    .wifi-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 30px;
      height: 30px;
      background: #1e1e2e;
      border: 1.5px solid rgba(245, 185, 66, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(245, 185, 66, 0.10);
      border: 1px solid rgba(245, 185, 66, 0.28);
      border-radius: 50px;
      padding: 0.28rem 0.85rem;
      font-size: 0.70rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
      font-family: 'Outfit', sans-serif;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.75rem, 5.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      margin-bottom: 0.55rem;
      line-height: 1.15;
    }

    .subtitle {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.55;
      max-width: 340px;
      margin-bottom: 2rem;
    }

    .status-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      justify-content: center;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-dot.ok   { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
    .status-dot.warn { background: var(--gold); box-shadow: 0 0 8px var(--gold-glow); animation: blink 1.4s step-end infinite; }
    .status-dot.err  { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.4); }

    .status-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .actions { width: 100%; display: flex; flex-direction: column; gap: 0.7rem; }

    .btn-primary {
      width: 100%;
      min-height: 52px;
      background: linear-gradient(135deg, #F5B942 0%, #E8912D 100%);
      border: none;
      border-radius: 16px;
      color: #08090C;
      font-family: 'Outfit', sans-serif;
      font-size: 0.98rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      box-shadow: 0 8px 24px -4px rgba(245, 185, 66, 0.42);
      transform: translate3d(0, 0, 0);
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:hover  { transform: translate3d(0, -2px, 0); box-shadow: 0 14px 32px -4px rgba(245, 185, 66, 0.58); }
    .btn-primary:active { transform: translate3d(0, 1px, 0) scale(0.985); }

    .btn-secondary {
      width: 100%;
      min-height: 50px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transform: translate3d(0, 0, 0);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-secondary:hover  {
      transform: translate3d(0, -2px, 0);
      border-color: rgba(245, 185, 66, 0.4);
      background: rgba(245, 185, 66, 0.06);
    }
    .btn-secondary:active { transform: scale(0.985); }

    .cached-label {
      margin-top: 2rem;
      font-size: 0.70rem;
      font-weight: 800;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.65rem;
    }

    .cached-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.9rem;
      justify-content: center;
    }

    .cached-links a {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: color 0.15s ease;
      padding: 0.15rem 0.1rem;
    }

    .cached-links a:hover { color: var(--gold); }

    @keyframes ringFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%       { transform: translateY(-6px) rotate(3deg); }
    }

    @keyframes iconPulse {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(245, 185, 66, 0.3)); }
      50%       { filter: drop-shadow(0 0 28px rgba(245, 185, 66, 0.6)); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="glow-top" aria-hidden="true"></div>
  <div class="glow-bottom" aria-hidden="true"></div>

  <div class="card" role="main">
    <div class="icon-wrap">
      <div class="icon-ring-outer" aria-hidden="true"></div>
      <div class="icon-ring" aria-hidden="true"></div>
      <img class="icon-img" src="/pwa-icon-192.png" alt="Style Corner" />
      <div class="wifi-badge" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5B942" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      </div>
    </div>

    <div class="badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      No Connection
    </div>

    <h1>You're Offline</h1>
    <p class="subtitle">
      Style Corner needs a connection to load. Check your Wi-Fi or mobile data, then tap <strong>Try Again</strong>.
    </p>

    <div class="status-row" aria-label="Connection status">
      <div class="status-item">
        <div class="status-dot ok" id="dot-cached"></div>
        <span class="status-label">Cache</span>
      </div>
      <div class="status-item">
        <div class="status-dot err" id="dot-network"></div>
        <span class="status-label">Network</span>
      </div>
      <div class="status-item">
        <div class="status-dot warn" id="dot-sw"></div>
        <span class="status-label">Service Worker</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="retryConnection()" id="btn-retry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Try Again
      </button>
      <button class="btn-secondary" onclick="window.location.href='/'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home (Cached)
      </button>
    </div>

    <p class="cached-label">Available offline</p>
    <nav class="cached-links" aria-label="Offline-available pages">
      <a href="/">Home</a>
      <a href="/services">Services</a>
      <a href="/experts">Specialists</a>
      <a href="/gallery">Lookbook</a>
      <a href="/store">Store</a>
    </nav>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready
        .then(() => { document.getElementById('dot-sw').className = 'status-dot ok'; })
        .catch(() => { document.getElementById('dot-sw').className = 'status-dot err'; });
    } else {
      document.getElementById('dot-sw').className = 'status-dot err';
    }

    function retryConnection() {
      const btn = document.getElementById('btn-retry');
      btn.disabled = true;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.7s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Checking\u2026';
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(() => { window.location.reload(); })
        .catch(() => {
          btn.disabled = false;
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Still Offline \u2014 Retry';
          document.getElementById('dot-network').className = 'status-dot err';
        });
    }

    window.addEventListener('online', () => {
      document.getElementById('dot-network').className = 'status-dot ok';
      setTimeout(() => window.location.reload(), 600);
    });
  </script>
</body>
</html>
